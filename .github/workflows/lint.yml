name: Lint and compile

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      # Report-only for now: the existing codebase has pre-existing style
      # findings. Drop --exit-zero (or set fail-fast) once they are cleaned up
      # so lint becomes a blocking gate.
      - name: Run ruff
        run: ruff check --exit-zero custom_components/

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile smoke test
        run: python -m compileall custom_components/tuya_smart_ir_ac
